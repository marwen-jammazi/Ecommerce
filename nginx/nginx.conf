worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;

  # per-IP request limit at the edge (the API also limits per route)
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

  upstream api_backend {
    least_conn;                                    # send traffic to the least busy instance
    server api1:5000 max_fails=3 fail_timeout=10s; # health-based failover
    server api2:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;

    # up to 5 images x 5 MB per upload request
    client_max_body_size 26m;

    location /health {
      access_log off;
      proxy_pass http://api_backend/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /api/ {
      limit_req zone=api_zone burst=40 nodelay;
      limit_req_status 429;

      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # if an instance is down, retry the next one (nginx never retries POST/PUT by default, so no double orders)
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
    }
  }
}